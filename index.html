          <label for="bookingFormatSelect">Session Format &amp; Urgency *</label>
          <select id="bookingFormatSelect" class="form-control"></select>
        </div>
        <div class="form-group">
          <label for="bookingDobInput">Date of Birth (Optional)</label>
          <input type="date" id="bookingDobInput" class="form-control" />
        </div>
        <div class="form-group">
          <label for="bookingDateInput">Preferred Session Date</label>
          <input type="date" id="bookingDateInput" class="form-control" />
        </div>
        <div class="form-group full-width">
          <label for="bookingNotesInput">Your Questions / Intention for Roli</label>
          <textarea id="bookingNotesInput" class="form-control" rows="3" placeholder="Share any questions or life areas (love, career, healing, remedies) you would like Roli to focus on..."></textarea>
        </div>
        <div class="form-group full-width" style="margin-top:8px;">
          <button type="submit" class="btn-primary" style="width:100%;">
            <i data-lucide="check-circle-2" data-size="17"></i>
            <span>Confirm Booking Request with Roli</span>
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- Toast Notification -->
  <div class="sacred-toast" id="sacredToast" role="status" aria-live="polite">
    <span style="color:var(--accent-amethyst);display:inline-flex;align-items:center;">
      <i data-lucide="check-circle-2" data-size="20"></i>
    </span>
    <span id="sacredToastText" style="font-size:0.9rem;font-weight:500;color:var(--text-primary);"></span>
  </div>
  <script src="app.js"></script>
</body>
</html>
